name: Android navigation E2E

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    name: Build and test primary navigation
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'e2e' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VARIANT: e2e
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_TESTER_ACCESS: 'true'
      EXPO_PUBLIC_SENTRY_ENABLED: 'false'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      MAESTRO_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      MAESTRO_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate the E2E Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build self-contained release APK
        working-directory: android
        run: ./gradlew app:assembleRelease --no-daemon

      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: 2.6.1
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Accept Android licenses and create emulator
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"
          echo no | avdmanager create avd --force --name trak_e2e --package "system-images;android-34;google_apis;x86_64"

      - name: Start emulator and install Trak
        run: |
          sudo chmod 666 /dev/kvm
          nohup emulator -avd trak_e2e -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >/tmp/trak-emulator.log 2>&1 &
          adb wait-for-device
          for attempt in {1..120}; do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then
              echo "Emulator ready after $attempt checks"
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb install -r android/app/build/outputs/apk/release/app-release.apk

      - name: Run navigation smoke test
        run: |
          maestro test \
            -e MAESTRO_TEST_EMAIL="$MAESTRO_TEST_EMAIL" \
            -e MAESTRO_TEST_PASSWORD="$MAESTRO_TEST_PASSWORD" \
            --format junit \
            --output maestro-report.xml \
            .maestro/navigation.yml

      - name: Collect Android logs
        if: always()
        run: adb logcat -d > /tmp/trak-logcat.txt || true

      - name: Upload Maestro diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-navigation-diagnostics
          if-no-files-found: ignore
          path: |
            maestro-report.xml
            ~/.maestro/tests
            /tmp/trak-emulator.log
            /tmp/trak-logcat.txt
