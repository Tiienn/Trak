name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Use Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Generate Expo TypeScript declarations
        run: npx expo customize tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit and evaluation gates
        run: npm test

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Check Expo project health
        run: npx expo-doctor

      - name: Reject critical production advisories
        run: npm audit --omit=dev --audit-level=critical

      - name: Bundle every platform
        run: npx expo export --platform all --clear
