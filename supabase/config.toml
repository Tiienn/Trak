# Supabase project configuration.
# The edge functions check the JWT's role WITHOUT verifying its signature —
# they rely on the platform's verify_jwt gateway doing that. Pinning it here
# keeps a future `--no-verify-jwt` deploy from silently disabling auth.
project_id = "trak"

[functions.trak-chat]
verify_jwt = true

[functions.analyze-food]
verify_jwt = true

[functions.analyze-body]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# Public page for the app stores' account-deletion URL — intentionally no auth.
[functions.deletion-info]
verify_jwt = false

# Public privacy policy page for the app stores — intentionally no auth.
[functions.privacy]
verify_jwt = false
